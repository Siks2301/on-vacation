<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar Sesión – On Vacation</title>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">On <em>Vacation</em></span>
    </a>
    <ul class="nav-links">
      <li><a href="servicios.html">Servicios</a></li>
      <li><a href="destinos.html">Destinos</a></li>
      <li><a href="tarifas.html">Tarifas</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn-ghost" onclick="showPage('p05')">Iniciar sesión</button>
      <button class="btn-primary" onclick="showPage('p06')">Registrarse</button>
    </div>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()">☰</button>
  </div>
</nav>
<main id="app">

  <section class="page active">
    <div class="auth-wrapper">
      <div class="auth-card">
        <a href="index.html" class="auth-brand">✦ On <em>Vacation</em></a>
        <h2>Bienvenido de vuelta</h2>
        <p class="auth-sub">Inicia sesión para gestionar tus reservas</p>
        <div id="login-error" class="alert-error" style="display:none">Credenciales incorrectas. Inténtalo de nuevo.</div>
        <div class="form-group"><label>Correo electrónico</label><input type="email" id="login-email" placeholder="tucorreo@ejemplo.com"/></div>
        <div class="form-group"><label>Contraseña</label><input type="password" id="login-pass" placeholder="••••••••"/></div>
        <div class="form-row"><label class="checkbox-label"><input type="checkbox"/> Recordarme</label><a href="recuperar-password.html" class="link">¿Olvidaste tu contraseña?</a></div>
        <button class="btn-primary full" onclick="doLogin()">Iniciar sesión</button>
        <div class="auth-footer">¿No tienes cuenta? <a href="registro.html" class="link">Regístrate aquí</a></div>
      </div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
