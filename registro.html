<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Cuenta – On Vacation</title>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
</head>
<body>
<nav class="navbar" id="navbar">
  <div class="nav-container">
    <a href="index.html" class="logo">
      <span class="logo-icon">✦</span>
      <span class="logo-text">On <em>Vacation</em></span>
    </a>
    <ul class="nav-links">
      <li><a href="servicios.html">Servicios</a></li>
      <li><a href="destinos.html">Destinos</a></li>
      <li><a href="tarifas.html">Tarifas</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contacto.html">Contacto</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn-ghost" onclick="showPage('p05')">Iniciar sesión</button>
      <button class="btn-primary" onclick="showPage('p06')">Registrarse</button>
    </div>
    <button class="hamburger" id="hamburger" onclick="toggleMenu()">☰</button>
  </div>
</nav>
<main id="app">

  <section class="page active">
    <div class="auth-wrapper">
      <div class="auth-card wide">
        <a href="index.html" class="auth-brand">✦ On <em>Vacation</em></a>
        <h2>Crea tu cuenta</h2>
        <p class="auth-sub">Empieza a disfrutar de las mejores experiencias</p>
        <div id="reg-error" class="alert-error" style="display:none">Por favor, completa todos los campos correctamente.</div>
        <div class="form-grid">
          <div class="form-group"><label>Nombre</label><input type="text" id="reg-nombre" placeholder="Tu nombre"/></div>
          <div class="form-group"><label>Apellido</label><input type="text" id="reg-apellido" placeholder="Tu apellido"/></div>
          <div class="form-group"><label>Correo electrónico</label><input type="email" id="reg-email" placeholder="tucorreo@ejemplo.com"/></div>
          <div class="form-group"><label>Teléfono</label><input type="tel" id="reg-tel" placeholder="+57 300 000 0000"/></div>
          <div class="form-group"><label>Contraseña</label><input type="password" id="reg-pass" placeholder="Mínimo 8 caracteres"/></div>
          <div class="form-group"><label>Confirmar contraseña</label><input type="password" id="reg-pass2" placeholder="Repite tu contraseña"/></div>
        </div>
        <label class="checkbox-label"><input type="checkbox" id="reg-terms"/> Acepto los <a href="#" class="link">términos y condiciones</a> y la <a href="#" class="link">política de privacidad</a></label>
        <button class="btn-primary full" style="margin-top:1.2rem" onclick="doRegister()">Crear cuenta</button>
        <div class="auth-footer">¿Ya tienes cuenta? <a href="login.html" class="link">Inicia sesión</a></div>
      </div>
    </div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
